[project]
name = "deepvoice-dacon-236749"
version = "0.1.0"
description = "Workspace for the DACON AI Deepvoice Detection Challenge"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "demucs>=4.0.1",
    "librosa>=0.10.2.post1",
    "torch>=2.13.0",
    "torchaudio>=2.11.0",
]

[dependency-groups]
# Libraries needed to run baseline/script.py locally. CUDA-enabled PyTorch is
# supplied separately by the competition image; install a compatible local
# PyTorch build if it is not already available.
runtime = [
    "accelerate==1.9.0",
    "demucs==4.0.1",
    "einops==0.8.1",
    "huggingface-hub==0.34.4",
    "julius==0.2.7",
    "librosa==0.10.2.post1",
    "loguru==0.7.2",
    "matplotlib==3.9.2",
    "numpy==1.26.4",
    "onnxruntime-gpu==1.22.0",
    "pandas==2.0.3",
    "panns-inference==0.1.1",
    "pyyaml==6.0.1",
    "regex==2023.12.25",
    "rich==13.7.1",
    "safetensors==0.6.2",
    "scikit-learn==1.8.0",
    "scipy==1.15.3",
    "sentencepiece==0.1.99",
    "soundfile==0.12.1",
    "soxr==0.5.0.post1",
    "tqdm==4.66.4",
    "torchlibrosa==0.1.0",
    "transformers==4.57.6",
]

[tool.uv]
default-groups = []
