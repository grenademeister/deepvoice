[project]
name = "deepvoice-dacon-236749"
version = "0.1.0"
description = "Workspace for the DACON AI Deepvoice Detection Challenge"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "demucs==4.0.1",
    "einops==0.8.1",
    "librosa==0.10.2.post1",
    "numpy==1.26.4",
    "onnxruntime-gpu==1.22.0",
    "panns-inference==0.1.1",
    "scikit-learn==1.8.0",
    "scipy==1.15.3",
    "torch==2.7.1",
    "torchaudio==2.7.1",
    "transformers==4.57.6",
]

[dependency-groups]
dev = ["pytest>=8,<9"]

[tool.uv]
default-groups = []

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]
